<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wikollector check</title>
<!-- Runs Cloudflare Turnstile invisibly inside the Wikollector app and hands the token back to it. -->
<script>
  function send(message) {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(message));
  }
  function start() {
    var key = new URLSearchParams(location.search).get('sitekey');
    if (!key) return send({ error: 'no sitekey' });
    turnstile.render('#check', {
      sitekey: key,
      callback: function (token) { send({ token: token }); },
      'error-callback': function (code) { send({ error: String(code) }); return true; },
      'expired-callback': function () { send({ error: 'expired' }); },
      'timeout-callback': function () { send({ error: 'timeout' }); }
    });
  }
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=start&render=explicit" async defer onerror="send({ error: 'script' })"></script>
</head>
<body style="margin:0;background:transparent">
<div id="check"></div>
</body>
</html>
